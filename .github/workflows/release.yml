# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build and publish latest release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kemoshumai/kemo-vibe-mixxx'
    uses: ./.github/workflows/build.yml
    with:
      # Keep the build workflow's uploads as GitHub Actions artifacts, but do not
      # run any of the upstream Mixxx deployment steps.
      publish: false
      branch: ${{ github.ref_name }}
      ref: ${{ github.ref }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Update rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          RELEASE_TITLE: Latest build
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No build artifacts were downloaded." >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '.id')
            while IFS= read -r asset_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --jq '.[].id')
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --target "${GITHUB_SHA}" \
              --prerelease=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}"
